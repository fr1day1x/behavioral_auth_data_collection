<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Breach Aim Trainer</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-primary: #c5c6c7;
            --target-color: #66fcf1;
            --target-shadow: rgba(102, 252, 241, 0.6);
            --error-color: #ff004c;
            --success-color: #45a29e;
            --panel-bg: #1f2833;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace; /* Arcade Hacker aesthetic */
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; user-select: none;
        }

        #menu-view, #game-view {
            display: flex; flex-direction: column;
            align-items: center; width: 100%; max-width: 800px;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 3rem; color: var(--target-color);
            text-shadow: 0 0 10px var(--target-shadow);
            margin-bottom: 1rem; text-transform: uppercase;
        }

        .subtitle { color: var(--text-primary); margin-bottom: 3rem; font-size: 1.2rem; }

        .input-group { text-align: center; margin-bottom: 1.5rem; }
        .input-label { display: block; margin-bottom: 10px; font-size: 1.2rem; }
        
        input {
            background: var(--panel-bg); border: 2px solid var(--target-color);
            color: var(--target-color); font-size: 1.5rem; font-family: inherit;
            padding: 10px; text-align: center; text-transform: uppercase;
            outline: none; box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
        }

        .hint-text { margin-top: 15px; font-size: 1rem; opacity: 0.7; }
        #feedback-msg { margin-top: 2rem; font-size: 1.2rem; height: 1.5rem; font-weight: bold; }

        /* --- GAME HUD --- */
        #hud {
            display: flex; justify-content: space-between;
            width: 600px; margin-bottom: 10px; font-size: 1.2rem; font-weight: bold;
        }
        .score-box { color: var(--target-color); }
        .acc-box { color: var(--success-color); }

        #canvas-container {
            position: relative; width: 600px; height: 600px;
            background: #111; border: 2px solid var(--panel-bg);
            border-radius: 8px; overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        #target-dot {
            position: absolute; width: 60px; height: 60px;
            background-color: var(--target-color); border-radius: 50%;
            cursor: crosshair; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--target-shadow);
        }

        /* The shrinking timer ring */
        #target-ring {
            position: absolute; border: 2px solid var(--target-color);
            border-radius: 50%; top: -10px; left: -10px; right: -10px; bottom: -10px;
            animation: shrink 1.5s linear forwards; pointer-events: none;
        }

        @keyframes shrink {
            0% { transform: scale(1.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flash-red { animation: damage 0.2s; }
        .flash-green { animation: stageClear 1s; }

        @keyframes damage {
            0% { background-color: var(--error-color); }
            100% { background-color: #111; }
        }
        @keyframes stageClear {
            0% { background-color: var(--success-color); }
            100% { background-color: #111; }
        }

        /* --- COGNITIVE KEYPAD (BOSS STAGE) --- */
        #keypad-container {
            display: grid; grid-template-columns: repeat(3, 80px); gap: 15px;
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            background: var(--panel-bg); padding: 30px; border-radius: 8px;
            border: 2px solid var(--target-color);
            box-shadow: 0 0 30px var(--target-shadow);
            z-index: 5;
        }

        .keypad-btn {
            width: 80px; height: 80px; background-color: #111;
            color: var(--target-color); font-size: 2rem; font-weight: bold;
            border: 2px solid var(--target-color); border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .keypad-btn:active { background-color: var(--target-color); color: #000; }

        #pin-prompt {
            position: absolute; top: 5%; width: 100%; text-align: center;
            font-size: 1.5rem; color: var(--error-color); text-transform: uppercase;
            z-index: 10;
        }
        #target-pin { font-size: 2.5rem; display: block; margin-top: 10px; color: var(--target-color); letter-spacing: 5px; }
    </style>
</head>
<body>

    <!-- MENU SCREEN -->
    <div id="menu-view">
        <h1>Cyber-Breach</h1>
        <div class="subtitle">Reaction & Synchronization Protocol</div>
        <div class="input-group">
            <span class="input-label">Enter Operative ID:</span>
            <input type="text" id="participant-id" maxlength="10" autocomplete="off" autofocus>
        </div>
        <div class="hint-text">Press [ENTER] to initiate sequence</div>
        <div id="feedback-msg"></div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-view" class="hidden">
        
        <div id="hud">
            <div>Stage: <span id="round-text">1/3</span></div>
            <div class="score-box">Score: <span id="score-val">0</span></div>
            <div class="acc-box">Accuracy: <span id="acc-val">100</span>%</div>
        </div>
        
        <div id="canvas-container">
            <div id="target-dot" class="hidden"><div id="target-ring"></div></div>
            
            <!-- COGNITIVE OVERRIDE MINIGAME -->
            <div id="pin-prompt" class="hidden">System Override Required<span id="target-pin"></span></div>
            <div id="keypad-container" class="hidden">
                <div class="keypad-btn" data-val="1">1</div>
                <div class="keypad-btn" data-val="2">2</div>
                <div class="keypad-btn" data-val="3">3</div>
                <div class="keypad-btn" data-val="4">4</div>
                <div class="keypad-btn" data-val="5">5</div>
                <div class="keypad-btn" data-val="6">6</div>
                <div class="keypad-btn" data-val="7">7</div>
                <div class="keypad-btn" data-val="8">8</div>
                <div class="keypad-btn" data-val="9">9</div>
                <div></div>
                <div class="keypad-btn" data-val="0">0</div>
                <div></div>
            </div>
        </div>
    </div>

    <script>
        // --- TELEMETRY ENGINE (Unchanged Data Structures) ---
        let currentPath = [];
        let lastSampleTime = 0;
        const SAMPLE_INTERVAL_MS = 10;
        let isTrackingTrajectory = false;
        let currentMouseX = 0, currentMouseY = 0;

        document.addEventListener('mousemove', (e) => {
            currentMouseX = e.clientX; currentMouseY = e.clientY;
            if (!isTrackingTrajectory) return;
            const now = performance.now();
            if (now - lastSampleTime >= SAMPLE_INTERVAL_MS) {
                currentPath.push({ x: e.clientX, y: e.clientY });
                lastSampleTime = now;
            }
        });
        
        let appState = "MENU", participantId = "";
        let targetsHit = 0, totalClicks = 0;
        const maxTargets = 20; // 20 per round makes for a good arcade feel
        let roundsCompleted = 0, maxRounds = 3;
        let sessionRounds = [];
        let gameScore = 0;
        
        const gridPositions = [];
        const startX = 150, startY = 150, spacing = 100;
        for(let r=0; r<4; r++) {
            for(let c=0; c<4; c++) {
                gridPositions.push({ x: startX + c*spacing, y: startY + r*spacing, index: r*4 + c });
            }
        }

        let activeTargetIndex = 0, previousTargetIndex = -1;
        let targetSpawnTime = 0, lastClickTime = 0, mouseDownTime = 0;
        let timeoutTimer = null;

        let rawSessionData = {
            reaction_times: { Adjacent: [], Diagonal: [], Medium: [], Long: [], First: [] },
            itis: { Adjacent: [], Diagonal: [], Medium: [], Long: [] },
            dwell_times: { Adjacent: [], Diagonal: [], Medium: [], Long: [], First: [] },
            path_efficiencies: [],
            x_offsets: [], y_offsets: [], total_errors: 0
        };

        // --- COGNITIVE DATA ---
        let cognitivePhase = 0; 
        let currentPinTarget = "", currentPinInput = "";
        let pinClickTimestamps = [];
        let cognitiveData = {
            familiar: { flight_times: [], path_efficiencies: [] },
            unfamiliar: { flight_times: [], path_efficiencies: [] }
        };

        const menuView = document.getElementById('menu-view'), gameView = document.getElementById('game-view');
        const targetDot = document.getElementById('target-dot'), canvasContainer = document.getElementById('canvas-container');
        const scoreVal = document.getElementById('score-val'), accVal = document.getElementById('acc-val');

        window.addEventListener('keydown', (e) => {
            if (appState !== "MENU") return;
            if (e.key === "Enter") {
                const idValue = document.getElementById('participant-id').value.trim().toUpperCase();
                if (idValue.length > 0) executeDataAcquisition(idValue);
                else document.getElementById('feedback-msg').innerText = "Operative ID Required.";
            }
        });

        async function executeDataAcquisition(id) {
            document.getElementById('feedback-msg').innerText = "Connecting to mainframe...";
            try {
                // await fetch(`/check/${id}`); // Removed for pure client-side testing, add back if checking IDs
                participantId = id; roundsCompleted = 0; gameScore = 0; totalClicks = 0;
                appState = "COLLECT"; sessionRounds = [];
                startNewRound();
            } catch (error) {
                document.getElementById('feedback-msg').innerText = "Connection Failed.";
            }
        }

        function startNewRound() {
            targetsHit = 0;
            rawSessionData = {
                reaction_times: { Adjacent: [], Diagonal: [], Medium: [], Long: [], First: [] },
                itis: { Adjacent: [], Diagonal: [], Medium: [], Long: [] },
                dwell_times: { Adjacent: [], Diagonal: [], Medium: [], Long: [], First: [] },
                path_efficiencies: [], x_offsets: [], y_offsets: [], total_errors: 0
            };

            menuView.classList.add('hidden'); gameView.classList.remove('hidden');
            canvasContainer.classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('keypad-container').classList.add('hidden');
            document.getElementById('pin-prompt').classList.add('hidden');

            updateOverlay(); spawnTarget(true);
        }

        function updateOverlay() {
            document.getElementById('round-text').innerText = `${roundsCompleted + 1}/${maxRounds}`;
            scoreVal.innerText = gameScore;
            let accuracy = totalClicks === 0 ? 100 : Math.round(((totalClicks - rawSessionData.total_errors) / totalClicks) * 100);
            accVal.innerText = accuracy;
            accVal.style.color = accuracy < 80 ? 'var(--error-color)' : 'var(--success-color)';
        }

        function spawnTarget(isFirst = false) {
            if (timeoutTimer) clearTimeout(timeoutTimer);
            targetDot.classList.add('hidden');

            if (targetsHit >= maxTargets) { processRoundCompletion(); return; }

            let newIndex = Math.floor(Math.random() * 16);
            if (!isFirst) while (newIndex === activeTargetIndex) newIndex = Math.floor(Math.random() * 16);
            activeTargetIndex = newIndex;

            const delay = isFirst ? 500 : Math.floor(Math.random() * 400) + 200; // Faster arcade pacing
            setTimeout(() => {
                const pos = gridPositions[activeTargetIndex];
                targetDot.style.left = `${pos.x}px`; targetDot.style.top = `${pos.y}px`;
                
                // Restart animation ring
                const ring = document.getElementById('target-ring');
                ring.style.animation = 'none'; ring.offsetHeight; ring.style.animation = null;

                targetDot.classList.remove('hidden');
                targetSpawnTime = performance.now();
                if (targetsHit === 0) lastClickTime = targetSpawnTime;

                currentPath = [{ x: currentMouseX, y: currentMouseY }];
                lastSampleTime = targetSpawnTime; isTrackingTrajectory = true;

                timeoutTimer = setTimeout(handleTimeout, 1500); // 1.5 seconds to hit it
            }, delay);
        }

        targetDot.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            e.stopPropagation(); 
            mouseDownTime = performance.now();
            totalClicks++;
        });

        targetDot.addEventListener('mouseup', (e) => {
            if (e.button !== 0) return; e.stopPropagation();
            isTrackingTrajectory = false; currentPath.push({ x: e.clientX, y: e.clientY });

            const clickUpTime = performance.now();
            const dwellTime = clickUpTime - mouseDownTime;
            const reactionTime = mouseDownTime - targetSpawnTime;
            
            gameScore += Math.max(10, 500 - Math.floor(reactionTime)); // Faster = more points

            const rect = targetDot.getBoundingClientRect();
            const xOffset = e.clientX - (rect.left + rect.width / 2);
            const yOffset = e.clientY - (rect.top + rect.height / 2);

            let pathEfficiency = calculateSegmentEfficiency(currentPath, e.clientX, e.clientY);

            if (targetsHit < 3) {
                // Warmup
            } else if (targetsHit === 3) {
                rawSessionData.reaction_times.First.push(reactionTime);
                rawSessionData.dwell_times.First.push(dwellTime);
                rawSessionData.x_offsets.push(xOffset); rawSessionData.y_offsets.push(yOffset);
                rawSessionData.path_efficiencies.push(pathEfficiency);
            } else {
                const iti = mouseDownTime - lastClickTime;
                const jumpType = calculateJumpType(previousTargetIndex, activeTargetIndex);
                rawSessionData.reaction_times[jumpType].push(reactionTime);
                rawSessionData.itis[jumpType].push(iti);
                rawSessionData.dwell_times[jumpType].push(dwellTime);
                rawSessionData.x_offsets.push(xOffset); rawSessionData.y_offsets.push(yOffset);
                rawSessionData.path_efficiencies.push(pathEfficiency);
            }

            previousTargetIndex = activeTargetIndex; lastClickTime = mouseDownTime;
            targetsHit++; updateOverlay(); spawnTarget();
        });

        canvasContainer.addEventListener('mousedown', () => {
            if (appState === "MENU" || targetDot.classList.contains('hidden') || cognitivePhase !== 0) return;
            totalClicks++; handleMiss();
        });

        function handleMiss() {
            rawSessionData.total_errors++;
            gameScore = Math.max(0, gameScore - 50); // Penalty
            canvasContainer.classList.add('flash-red');
            setTimeout(() => canvasContainer.classList.remove('flash-red'), 150);
            updateOverlay();
        }

        function handleTimeout() {
            totalClicks++; handleMiss(); spawnTarget();
        }

        function calculateJumpType(i1, i2) {
            const r1 = Math.floor(i1 / 4), c1 = i1 % 4;
            const r2 = Math.floor(i2 / 4), c2 = i2 % 4;
            const gridDist = Math.hypot(r2 - r1, c2 - c1);
            if (gridDist === 1.0) return "Adjacent";
            if (gridDist > 1.0 && gridDist <= 1.5) return "Diagonal";
            if (gridDist > 1.5 && gridDist <= 2.5) return "Medium";
            return "Long";
        }

        function processRoundCompletion() {
            sessionRounds.push(rawSessionData); roundsCompleted++;
            if (roundsCompleted < maxRounds) {
                canvasContainer.classList.add('flash-green');
                setTimeout(() => {
                    canvasContainer.classList.remove('flash-green'); startNewRound();
                }, 1500);
            } else {
                document.getElementById('hud').classList.add('hidden');
                setTimeout(startCognitiveTest, 1000);
            }
        }

        // --- BOSS STAGE: COGNITIVE MINIGAME ---
        function startCognitiveTest() {
            targetDot.classList.add('hidden');
            document.getElementById('keypad-container').classList.remove('hidden');
            document.getElementById('pin-prompt').classList.remove('hidden');
            startFamiliarPhase();
        }

        function startFamiliarPhase() {
            cognitivePhase = 1; currentPinTarget = "1234"; 
            document.getElementById('pin-prompt').innerHTML = `DEFAULT PROTOCOL<span id="target-pin">${currentPinTarget}</span>`;
            resetPinTracking();
        }

        function startUnfamiliarPhase() {
            cognitivePhase = 2; currentPinTarget = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('pin-prompt').innerHTML = `DECRYPTION KEY<span id="target-pin">${currentPinTarget}</span>`;
            resetPinTracking();
        }

        function resetPinTracking() {
            currentPinInput = ""; pinClickTimestamps = [];
            currentPath = [{ x: currentMouseX, y: currentMouseY }];
            lastSampleTime = performance.now(); isTrackingTrajectory = true; 
        }

        function calculateSegmentEfficiency(pathObj, endX, endY) {
            if (pathObj.length < 2) return 1.0;
            const start = pathObj[0]; const end = { x: endX, y: endY };
            const dStraight = Math.hypot(end.x - start.x, end.y - start.y);
            let dActual = 0;
            for (let i = 1; i < pathObj.length; i++) {
                dActual += Math.hypot(pathObj[i].x - pathObj[i - 1].x, pathObj[i].y - pathObj[i - 1].y);
            }
            dActual += Math.hypot(end.x - pathObj[pathObj.length - 1].x, end.y - pathObj[pathObj.length - 1].y);
            return dActual > 0 ? Number((dStraight / dActual).toFixed(4)) : 1.0;
        }

        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('mousedown', (e) => {
                if (cognitivePhase === 0) return;
                
                const val = e.target.getAttribute('data-val');
                currentPinInput += val;
                const clickTime = performance.now();
                pinClickTimestamps.push(clickTime);
                
                if (pinClickTimestamps.length > 1) {
                    const flightTime = clickTime - pinClickTimestamps[pinClickTimestamps.length - 2];
                    const phaseKey = cognitivePhase === 1 ? 'familiar' : 'unfamiliar';
                    cognitiveData[phaseKey].flight_times.push(Number(flightTime.toFixed(2)));
                    const segmentEfficiency = calculateSegmentEfficiency(currentPath, e.clientX, e.clientY);
                    cognitiveData[phaseKey].path_efficiencies.push(segmentEfficiency);
                }
                
                currentPath = [{ x: e.clientX, y: e.clientY }];
                
                if (currentPinInput.length === 4) {
                    if (cognitivePhase === 1) {
                        setTimeout(startUnfamiliarPhase, 500);
                    } else {
                        isTrackingTrajectory = false; cognitivePhase = 0; 
                        sendPayloadToCloud();
                    }
                }
            });
        });

        async function sendPayloadToCloud() {
            gameView.classList.add('hidden'); menuView.classList.remove('hidden');
            document.getElementById('feedback-msg').innerText = "Transmitting Telemetry...";
            appState = "MENU";

            const payload = {
                participant_id: participantId, mode: "ENROLL",
                rounds: sessionRounds, cognitive_data: cognitiveData
            };

            try {
                const response = await fetch('/enroll', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) document.getElementById('feedback-msg').innerHTML = `Operative <span style="color:var(--target-color)">${participantId}</span> Enrolled Successfully.`;
                else document.getElementById('feedback-msg').innerText = "Upload Error.";
            } catch (error) {
                document.getElementById('feedback-msg').innerText = "Connection Failed.";
            }
        }
    </script>
</body>
</html>
